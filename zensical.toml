[project]
site_name = "Flockadoo Docs"
site_url = "https://docs.flockadoo.ai/"
site_description = "Guides for Flockadoo providers and API consumers."
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/Flockadoo/flockadoo-docs"
repo_name = "flockadoo-docs"
edit_uri = "edit/main/docs/"
copyright = "&copy; 2026 Flockadoo Limited · <a href=\"https://flockadoo.ai/terms\">Terms</a> · <a href=\"https://flockadoo.ai/privacy\">Privacy</a>"
extra_css = ["stylesheets/flockadoo.css"]

nav = [
  { "Overview" = "index.md" },
  { "Getting started" = [
    { "Software and hardware requirements" = "getting-started/requirements.md" },
    { "Sign up and create a flock" = "getting-started/signup.md" },
    { "Installation" = "getting-started/installation.md" },
  ] },
  { "Consumer" = [
    { "Using the API" = "consumer/using-the-api.md" },
    { "Monthly spending caps" = "consumer/monthly-spending-caps.md" },
    { "Max price limits" = "consumer/max-price-limits.md" },
    { "Using your own flocks" = "consumer/own-flocks.md" },
    { "Request routing options" = "consumer/request-routing-options.md" },
    { "Supported parameters" = "consumer/supported-parameters.md" },
    { "Automatic model selection" = "consumer/automatic-model-selection.md" },
    { "Using a flock address" = "consumer/flock-addresses.md" },
  ] },
  { "Provider (dashboard)" = [
    { "Deleting and managing flocks" = "provider/deleting-flocks.md" },
    { "Flock location" = "provider/flock-location.md" },
    { "Model pricing" = "provider/model-pricing.md" },
    { "Team Flocks" = "provider/team-flocks.md" },
    { "Team Flock networking" = "provider/Team Flock-networking.md" },
    { "Inviting nodes" = "provider/inviting-nodes.md" },
    { "Joining a flock" = "provider/joining-a-flock.md" },
    { "Flock earnings" = "provider/flock-earnings.md" },
    { "Flock addresses" = "provider/flock-addresses.md" },
    { "Engine checks" = "provider/flock-checks.md" },
  ] },
  { "Provider client" = [
    { "Introduction" = "provider-client/introduction.md" },
    { "How it works" = "provider-client/how-it-works.md" },
    { "Setup wizard" = "provider-client/setup.md" },
    { "Configuration" = "provider-client/configuration.md" },
    { "Updating the client" = "provider-client/updating.md" },
    { "Setup: Linux" = "provider-client/setup-linux.md" },
    { "Setup: macOS" = "provider-client/setup-mac.md" },
    { "Setup: Windows" = "provider-client/setup-windows.md" },
    { "Downloading models" = "provider-client/downloading-models.md" },
    { "Model compatibility check" = "provider-client/compatibility.md" },
    { "FAQ" = "provider-client/faq.md" },
    { "Approved model builds" = "provider-client/approved-models.md" },
    { "Local REST API" = "provider-client/rest-api.md" },
  ] },
  { "Email notifications" = "email-notifications.md" },
  { "API reference" = "api/" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
favicon = "assets/favicon.svg"
font = false
features = [
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "flockadoo/mark"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Flockadoo"
